[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcsc-prefect"
version = "0.3.1"
description = "Meta-package for installing QCSC Prefect core packages"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "QCSC Prefect Contributors" },
]
maintainers = [
    { name = "QCSC Prefect Maintainers" },
]
dependencies = [
    "qcsc-prefect-adapters==0.3.1",
    "qcsc-prefect-blocks==0.3.1",
    "qcsc-prefect-core==0.3.1",
    "qcsc-prefect-executor==0.3.1",
]

[project.optional-dependencies]
qiskit = [
    "qcsc-prefect-qiskit==0.3.1",
]
dice = [
    "qcsc-prefect-dice==0.3.1",
]
sbd = [
    "qcsc-prefect-sbd==0.3.1",
]
# Python-side integration only; fulqrum itself is built per site
# (packages/qcsc-prefect-fulqrum/native/build_fulqrum.sh).
fulqrum = [
    "qcsc-prefect-fulqrum==0.3.1",
]
all = [
    "qcsc-prefect-dice==0.3.1",
    "qcsc-prefect-fulqrum==0.3.1",
    "qcsc-prefect-qiskit==0.3.1",
    "qcsc-prefect-sbd==0.3.1",
]

[project.urls]
Homepage = "https://github.com/qiskit-community/qcsc-prefect"
Repository = "https://github.com/qiskit-community/qcsc-prefect"
Documentation = "https://qiskit-community.github.io/qcsc-prefect/"
Issues = "https://github.com/qiskit-community/qcsc-prefect/issues"

[tool.setuptools]
packages = []
