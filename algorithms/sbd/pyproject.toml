[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sbd"
version = "0.1.0"
description = "Prefect workflow of SBD experiment from arXiv:2511.00224."
authors = [
    { name = "Yuto Morohoshi", email = "mrhsyut@ibm.com" }
]
maintainers = [
    { name = "Yuto Morohoshi", email = "mrhsyut@ibm.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ffsim",
    "qiskit-addon-sqd",
    "anyio>=4",
    "prefect[aws]>=3.4.14",
    "pydantic_numpy",
    "qcsc-prefect-dice",
    "qcsc-prefect-qiskit",
    "qcsc-prefect-sbd",
    "qcsc_workflow_utility",
    "qiskit-ibm-runtime",
]

[project.optional-dependencies]
# Ray is an optional task runner backend. Without it, the flow uses the
# ProcessPoolTaskRunner / ConcurrentTaskRunner (see SBD_TASK_RUNNER).
ray = ["prefect-ray"]

# QFw-SLURM validation currently uses ffsim 0.0.84.
qfw = ["ffsim==0.0.84"]

[tool.uv.sources]
qcsc-prefect-core = { path = "../../packages/qcsc-prefect-core", editable = true }
qcsc-prefect-adapters = { path = "../../packages/qcsc-prefect-adapters", editable = true }
qcsc-prefect-blocks = { path = "../../packages/qcsc-prefect-blocks", editable = true }
qcsc-prefect-executor = { path = "../../packages/qcsc-prefect-executor", editable = true }
qcsc-prefect-dice = { path = "../../packages/qcsc-prefect-dice", editable = true }
qcsc-prefect-qiskit = { path = "../../packages/qcsc-prefect-qiskit", editable = true }
qcsc-prefect-sbd = { path = "../../packages/qcsc-prefect-sbd", editable = true }
qcsc_workflow_utility = { path = "../qcsc_workflow_utility", editable = true }

[tool.setuptools]
packages = ["sbd"]
include-package-data = true
zip-safe = false

[project.scripts]
sbd-deploy = "sbd.main:deploy"
