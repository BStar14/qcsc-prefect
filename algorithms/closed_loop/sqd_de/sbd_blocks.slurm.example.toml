# Required for Slurm
hpc_target = "slurm" 
project = "YOUR_SLURM_ACCOUNT"
queue = "YOUR_SLURM_PARTITION"
work_dir = "/path/where/you/want/sbd_jobs"
sbd_executable = "/path/to/qcsc-prefect/packages/qcsc-prefect-sbd/native/diag"

# Optional execution profile
launcher = "srun"
walltime = "00:15:00"
num_nodes = 1
mpiprocs = 8
modules = []
mpi_options = []

# Optional block/variable names
command_block_name = "cmd-sbd-diag"
execution_profile_block_name = "exec-sbd-mpi"     # Default: "exec-sbd-slurm"
hpc_profile_block_name = "hpc-slurm-sbd"          # Default: "hpc-slurm-sbd"
solver_block_name = "davidson-solver"             # Default: "davidson-solver-slurm"
options_variable_name = "sqd_options"

# Optional solver script / metrics naming
# script_filename = "sbd_solver.slurm"            # Slurm default
# metrics_artifact_key = "slurm-sbd-metrics"      # Slurm default

# Optional solver parameters
task_comm_size = 1
adet_comm_size = 1
bdet_comm_size = 1
# Fast preset for low-accuracy runs
block = 4
iteration = 1
tolerance = 0.01
carryover_ratio = 0.1
solver_mode = "cpu"

# Optional runtime options variable
# Default if omitted: {"params":{"shots":50000}} for Slurm

# QrmiRuntimeBlock "qrmi-runtime" for quantum_source = "real-device". Uncomment the
# tables below to create it; random and qfw runs do not need it. Set
# QRMI_IBM_QCS_IAM_APIKEY in the environment for scheduler = "iqp".
# [runtime]
# scheduler = "iqp"
# resource = "ibm_kingston"
#
# [runtime.qrmi]
# QRMI_IBM_QCS_ENDPOINT = "https://quantum.cloud.ibm.com/api/v1"
# QRMI_IBM_QCS_IAM_ENDPOINT = "https://iam.cloud.ibm.com"
# QRMI_IBM_QCS_SERVICE_CRN = "crn:v1:bluemix:public:quantum-computing:us-east:a/your-account:your-instance::"
