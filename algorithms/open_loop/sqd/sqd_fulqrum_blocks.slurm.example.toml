# SQD fulqrum workflow on a Slurm cluster.
# Copy to sqd_fulqrum_blocks.slurm.toml and run:
#   sqd-create-blocks --config algorithms/open_loop/sqd/sqd_fulqrum_blocks.slurm.toml
# Add --dry-run to print the resolved settings without saving anything.

# Required for Slurm
hpc_target = "slurm"
queue = "normal"                    # Slurm partition
# project = "YOUR_SLURM_ACCOUNT"    # Optional: #SBATCH --account
work_dir = "/data/sqd-fulqrum"      # Shared between the submit host and compute nodes
# qcsc-fulqrum-solve of the compute-node environment that has fulqrum built
fulqrum_executable = "/opt/venvs/fulqrum/bin/qcsc-fulqrum-solve"

# Execution profile. fulqrum runs as one OpenMP process per subspace.
launcher = "single"
walltime = "01:00:00"
num_nodes = 1
mpiprocs = 1
ompthreads = 4                      # --cpus-per-task and OMP_NUM_THREADS
modules = []
pre_commands = []
# slurm_memory = "8G"               # Optional: #SBATCH --mem
# [environments]
# OPENBLAS_NUM_THREADS = "1"

# Block names (these are the defaults)
command_block_name = "cmd-sqd-fulqrum-solver"
execution_profile_block_name = "exec-sqd-fulqrum-slurm"
hpc_profile_block_name = "hpc-slurm-sqd-fulqrum"
solver_block_name = "sqd-fulqrum-solver"
script_filename = "fulqrum_solver.slurm"
metrics_artifact_key = "slurm-sqd-fulqrum-metrics"
timeout_seconds = 7200

# Solver options
eigensolver = "scipy"               # "primme" needs primme on the compute node
hamiltonian_format = "csr"          # "matrix_free" saves memory
tol = 1e-8
# max_iter = 1000                   # Default: solver default
dense_max_dim = 64
return_sci_state = false            # The workflow only needs energies and occupancies

# QrmiRuntimeBlock for quantum_source = "real-device" (sampling.runtime_block_name of each
# run). Uncomment ONE of the two options below. Without either, an existing block is kept.
# runtime_block_name = "qrmi-runtime"

# Option 1, QRMI in a Slurm job: creates the three blocks of the QRMI sampler job and a
# scheduler = "slurm" runtime block that names them. Unset queue, project, work_dir
# (default: work_dir/qrmi), modules, pre_commands, environments and ompthreads follow the
# solver settings.
# [qrmi]
# resource = "YOUR_QRMI_RESOURCE"   # Slurm --qpu; must match the QRMI configuration
# python_executable = "/opt/venvs/qrmi/bin/python"  # Imports qrmi, the worker and sqd_common
# walltime = "00:30:00"
# ompthreads = 4                    # The QPU is held while the node compiles
# timeout_seconds = 3600            # Monitoring only; does not cancel the job

# Option 2, any QrmiRuntimeBlock, for example IQP from the workflow process. Set
# QRMI_IBM_QCS_IAM_APIKEY in the environment; it must not be written in this file.
# [runtime]
# scheduler = "iqp"
# resource = "ibm_kingston"
# [runtime.qrmi]
# QRMI_IBM_QCS_ENDPOINT = "https://quantum.cloud.ibm.com/api/v1"
# QRMI_IBM_QCS_IAM_ENDPOINT = "https://iam.cloud.ibm.com"
# QRMI_IBM_QCS_SERVICE_CRN = "crn:v1:bluemix:public:quantum-computing:us-east:a/your-account:your-instance::"
