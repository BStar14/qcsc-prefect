# Prefect blocks of the SQD workflow. Copy this file, edit it, and run:
#   sqd-create-blocks --config sqd_blocks.toml
# Add --dry-run to print the resolved settings without saving anything.
#
# Sections:
#   1. Solver and system   which solver, and the system profile with its scheduler settings
#   2. Cluster             queue, account and the shared work directory
#   3. Solver              [fulqrum], [dice] or [sbd]: only the selected one is read
#   4. Quantum sampling    [qrmi] (a QRMI job in Slurm) or [runtime] (IBM Quantum, IQP)
#   5. Advanced SQD        [sqd_advanced]: CCSD restarts, reset mitigation, the transpiler
#   6. Block overrides     [advanced]: block names and timeouts
#
# Block names follow the solver and system, for example sqd-fulqrum-solver and
# exec-sqd-fulqrum-slurm, or sqd-dice-solver and exec-sqd-dice-miyabi. The run form
# needs no solver: this script records the solver block in the Advanced SQD Settings
# block (sqd-advanced-settings), which every run reads.

# ============================================================ 1. Solver and system

solver = "fulqrum"      # "fulqrum", "dice" (needs sqd[dice]) or "sbd" (blocks from closed_loop/sqd_de)
profile = "slurm"       # "slurm", "miyabi", "fugaku", or a path to your own profile
                        # GPU fulqrum, one MPI rank per GPU: "slurm-gpu" or "miyabi-gpu"
# Any key of the profile, for example walltime, num_nodes, mpiprocs or modules, can be
# set here to override it.

# ============================================================ 2. Cluster

queue = "normal"        # Slurm partition, or Miyabi/Fugaku resource group; a GPU queue for GPU
# project = "YOUR_ACCOUNT"  # Slurm account; required as the group on Miyabi and Fugaku
work_dir = "/data/sqd"  # Shared between the workflow host and the compute nodes

# Keys after a [table] header belong to that table, so keep top-level keys above here.

# ============================================================ 3. Solver

# fulqrum: qcsc-fulqrum-solve of the compute-node environment that has fulqrum built.
[fulqrum]
fulqrum_executable = "/opt/venvs/fulqrum/bin/qcsc-fulqrum-solve"
eigensolver = "scipy"   # "primme" needs primme on the compute node
# Tuning; empty keys keep the solver's defaults.
# tol = 1e-8                        # Eigensolver tolerance
# max_iter = 1000                   # Default: solver default
# hamiltonian_format = "csr"        # "matrix_free" saves memory
# dense_max_dim = 64
# max_basis_size = 64               # Search subspace (ncv); scipy, primme, gpu-mpi
# block_size = 4                    # PRIMME block size; primme and gpu-mpi
# min_restart_size = 16             # PRIMME restart size; primme and gpu-mpi
# primme_method = "PRIMME_DYNAMIC"  # PRIMME preset; primme and gpu-mpi
# backend = "cpu"                   # "gpu" or "gpu-mpi" (set by the GPU profiles)
# gpus_per_node = 4                 # Scheduler GPU request (set by the GPU profiles)
# convergence = "abs"               # gpu-mpi: abs, rel, norm or energy
# energy_tol = 1e-6                 # gpu-mpi with convergence = "energy"
# process_grid = [2, 2]             # gpu-mpi: alpha x beta ranks, product = MPI ranks
# comm_backend = "auto"             # gpu-mpi: auto, nccl, host_mpi or cuda_mpi

# DICE: used only with solver = "dice", on Miyabi or Fugaku.
[dice]
dice_executable = "/path/to/qcsc-prefect/packages/qcsc-prefect-dice/native/bin/Dice"
# select_cutoff = 5e-4
# davidson_tol = 1e-5
# energy_tol = 1e-10

# SBD: used only with solver = "sbd". algorithms/closed_loop/sqd_de/create_blocks.py
# creates the SBD blocks; this file only records which one the runs use.
# [sbd]
# solver_block_name = "davidson-solver"

# ============================================================ 4. Quantum sampling

# QRMI sampler job in Slurm, the default. Creates its three blocks (cmd-sqd-qrmi,
# exec-sqd-qrmi, hpc-slurm-sqd-qrmi) and the qrmi-runtime block that real-device runs
# use. The API key stays in the cluster's qrmi_config.json, so nothing secret goes in this
# file. The job's walltime, threads and timeout come from the profile.
[qrmi]
resource = "YOUR_QRMI_RESOURCE"   # Slurm --qpu and the backend; must be in qrmi_config.json
# Compute-node Python that imports qrmi (with task_runner beside it), the worker
# (qcsc-prefect-qiskit, which brings Prefect) and sqd_common
python_executable = "/opt/venvs/qrmi/bin/python"
# queue = "cpu"                   # Default: the solver's queue
# Plain block settings, editable in Prefect Cloud; they win over qrmi_config.json.
# service_crn = "crn:v1:bluemix:public:quantum-computing:us-east:a/your-account:your-instance::"
# endpoint = "https://quantum.cloud.ibm.com/api/v1"
# iam_endpoint = "https://iam.cloud.ibm.com"

# To sample from the workflow process through IBM Quantum (IQP) instead, comment out the
# whole [qrmi] table above and uncomment [runtime]. Set QRMI_IBM_QCS_IAM_APIKEY in the
# environment; it must not be written in this file. The block keeps it as a secret.
# [runtime]
# scheduler = "iqp"
# resource = "ibm_kingston"
# service_crn = "crn:v1:bluemix:public:quantum-computing:us-east:a/your-account:your-instance::"
# endpoint = "https://quantum.cloud.ibm.com/api/v1"   # Default for IQP
# iam_endpoint = "https://iam.cloud.ibm.com"          # Default for IQP

# ============================================================ 5. Advanced SQD settings

# The sqd-advanced-settings block, also editable in Prefect Cloud. Defaults shown.
# [sqd_advanced]
# ccsd_maxiter = 10                 # CCSD Restarts
# use_reset_mitigation = false      # Reset Mitigation; reloads of earlier samples use it too
# optimization_level = 3            # Transpiler
# sabre_layout_trials = 10000
# sabre_swap_trials = 10
# sabre_max_iterations = 8

# ============================================================ 6. Block overrides

# Rarely changed. Uncomment a key to replace its default.
# [advanced]
# solver_block_name = "sqd-<solver>-solver"
# command_block_name = "cmd-sqd-<solver>-solver"
# execution_profile_block_name = "exec-sqd-<solver>-<system>"
# hpc_profile_block_name = "hpc-<system>-sqd-<solver>"
# script_filename = "<solver>_solver.<suffix>"
# metrics_artifact_key = "<system>-sqd-<solver>-metrics"
# runtime_block_name = "qrmi-runtime"
# advanced_block_name = "sqd-advanced-settings"
# timeout_seconds = 7200            # Monitoring of each solver job
